name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (includes UCUM conformance + totality)
        run: cargo test --all-targets

      - name: Doctests
        run: cargo test --doc

      - name: Benchmarks compile
        run: cargo bench --no-run

      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Publish dry-run
        run: cargo publish --dry-run

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - name: Build + test on MSRV
        run: cargo test

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz smoke run (60s)
        # The prebuilt (musl) cargo-fuzz defaults its target to musl, whose
        # libFuzzer C++ needs a musl g++ that isn't on the runner. Pin the gnu
        # target, which has a working C/C++ toolchain.
        run: cargo fuzz run --target x86_64-unknown-linux-gnu parse -- -max_total_time=60
